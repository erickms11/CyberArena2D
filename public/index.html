<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Arena 2D - Multiplayer Online</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Style -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Game Canvas Container -->
  <div id="game-container"></div>

  <!-- Landing / Join Screen Overlay -->
  <div id="join-screen" class="overlay-panel">
    <div class="glass-card join-card">
      <div class="brand">
        <div class="logo-icon"><i class="fa-solid fa-gamepad"></i></div>
        <h1>CYBER ARENA <span>2D</span></h1>
        <p class="tagline">Jogo Online em Tempo Real • Multiplayer Canvas 2D</p>
      </div>

      <form id="join-form">
        <div class="input-group">
          <label for="player-name"><i class="fa-solid fa-user"></i> Seu Nickname</label>
          <input type="text" id="player-name" placeholder="Digite seu nome..." maxlength="16" required autocomplete="off">
        </div>

        <div class="input-group">
          <label><i class="fa-solid fa-palette"></i> Cor do Personagem</label>
          <div class="color-picker" id="color-options">
            <button type="button" class="color-btn active" data-color="#00f3ff" style="background:#00f3ff;"></button>
            <button type="button" class="color-btn" data-color="#ff007f" style="background:#ff007f;"></button>
            <button type="button" class="color-btn" data-color="#00ff66" style="background:#00ff66;"></button>
            <button type="button" class="color-btn" data-color="#ffb700" style="background:#ffb700;"></button>
            <button type="button" class="color-btn" data-color="#9d00ff" style="background:#9d00ff;"></button>
            <button type="button" class="color-btn" data-color="#ff3333" style="background:#ff3333;"></button>
          </div>
        </div>

        <div class="input-group">
          <label for="room-id"><i class="fa-solid fa-door-open"></i> Sala de Jogo</label>
          <div class="room-input-wrapper">
            <input type="text" id="room-id" placeholder="Nome da sala..." maxlength="20" required autocomplete="off">
            <button type="button" id="random-room-btn" title="Gerar sala aleatória"><i class="fa-solid fa-dice"></i></button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btn-enter-game">
          <span><i class="fa-solid fa-play"></i> ENTRAR NO JOGO</span>
        </button>
      </form>
    </div>
  </div>

  <!-- In-Game HUD Overlay -->
  <div id="game-hud" class="hud-layer hidden">
    <!-- Top Left Bar: Player Status & Score -->
    <div class="hud-top-left glass-hud">
      <div class="player-avatar-preview" id="hud-color-indicator"></div>
      <div class="player-info">
        <div class="hud-name" id="hud-player-name">Player</div>
        <div class="health-bar-container">
          <div class="health-bar-fill" id="hud-health-fill" style="width: 100%;"></div>
        </div>
        <div class="dash-bar-container">
          <div class="dash-bar-fill" id="hud-dash-fill" style="width: 100%;"></div>
        </div>
      </div>
      <div class="score-badge">
        <span class="label">PONTOS</span>
        <span class="value" id="hud-score">0</span>
      </div>
    </div>

    <!-- Top Right Bar: Room Info & Controls -->
    <div class="hud-top-right glass-hud">
      <div class="room-info">
        <span class="room-badge"><i class="fa-solid fa-network-wired"></i> <span id="hud-room-id">lobby</span></span>
        <span class="ping-badge" id="hud-ping"><i class="fa-solid fa-bolt"></i> -- ms</span>
      </div>
      <button class="btn-share" id="btn-share-link" title="Compartilhar Link da Sala">
        <i class="fa-solid fa-link"></i> Compartilhar Link
      </button>
    </div>

    <!-- Right Leaderboard -->
    <div class="hud-leaderboard glass-hud">
      <div class="leaderboard-header">
        <i class="fa-solid fa-trophy"></i> Jogadores na Sala (<span id="player-count">1</span>)
      </div>
      <ul id="leaderboard-list" class="leaderboard-list">
        <!-- Dynamic players list -->
      </ul>
    </div>

    <!-- Controls Helper Bar (Bottom Left) -->
    <div class="hud-controls-guide glass-hud">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Mover</span>
      <span><kbd>CLICK</kbd> Atirar</span>
      <span><kbd>SHIFT</kbd> Dash</span>
      <span><kbd>ENTER</kbd> Chat</span>
    </div>

    <!-- Bottom Left Chat Box -->
    <div class="hud-chat glass-hud" id="chat-container">
      <div class="chat-messages" id="chat-messages">
        <div class="chat-msg system">Bem-vindo à Cyber Arena! Colete as esferas brilhantes e enfrente os adversários!</div>
      </div>
      <form id="chat-form" class="chat-form">
        <input type="text" id="chat-input" placeholder="Pressione Enter para conversar..." maxlength="80" autocomplete="off">
        <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden">
    <i class="fa-solid fa-check-circle" id="toast-icon"></i>
    <span id="toast-message">Mensagem</span>
  </div>

  <!-- Main Game Script -->
  <script src="game.js"></script>

</body>
</html>
